name: Pipeline DevSecOps

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  secret_scanning:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout descargar codigo
      uses: actions/checkout@v6
      with: 
        fetch-depth: 0

    - name: Gitleaks
      uses: gitleaks/gitleaks-action@v3.0.0

  dependency_scan:
    needs: secret_scanning
    name: SCA Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout descargar codigo
      uses: actions/checkout@v6

    - name: Instalar dependencias
      run: npm install

    - name: Analisis SCA
      run: npm audit

  static_scan:
    needs: secret_scanning
    if: always()
    name: SAST scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout descargar codigo
      uses: actions/checkout@v6

    - name: ejecutar semgrep
      run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan \
            --config p/default \
            --sarif \
            --output semgrep.sarif \
            --error || true
